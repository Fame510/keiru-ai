<style>
:root{--violet:#6D28D9;--violet2:#7C3AED;--lav:#F5F3FF;--lav2:#EDE9FE;--ink:#1F1930;--muted:#716A82;--line:#E8E3F0;--white:#fff;--red:#DC2626;--redbg:#FEF2F2;--green:#059669;--greenbg:#ECFDF5;--amber:#D97706;--amberbg:#FFFBEB;--blue:#2563EB;--shadow:0 5px 18px rgba(56,28,105,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,Arial,sans-serif;background:#FAFAFC;color:var(--ink);font-size:14px}.app{min-height:100vh}.topbar{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 27px;position:sticky;top:0;z-index:30}.brand{font-family:Poppins,sans-serif;font-weight:800;font-size:24px;color:var(--violet);letter-spacing:-1px;margin-right:40px}.brand span{color:#A78BFA}.nav{display:flex;gap:4px;height:100%;align-items:center}.nav a{text-decoration:none;color:#625b70;padding:9px 12px;border-radius:9px;font-weight:700;white-space:nowrap}.nav a:hover{background:var(--lav)}.nav a.active{background:var(--lav2);color:var(--violet)}.user{margin-left:auto;display:flex;align-items:center;gap:9px;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:white;display:grid;place-items:center}.page{max-width:1240px;margin:0 auto;padding:28px 26px 70px}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:12px;color:var(--violet);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}h1{font:800 27px Poppins,sans-serif;margin:0;color:#251C39;letter-spacing:-.7px}h2{font:800 17px Poppins,sans-serif;margin:0}h3{margin:0;font-size:15px}.sub{color:var(--muted);margin:5px 0 0}.btn{border:0;border-radius:9px;padding:10px 15px;font:800 13px Nunito,sans-serif;cursor:pointer;transition:.15s;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.primary{background:var(--violet);color:white;box-shadow:0 3px 8px #6d28d92c}.secondary{background:var(--lav2);color:var(--violet)}.plain{background:white;border:1px solid var(--line);color:#574f63}.danger{background:var(--redbg);color:var(--red)}.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:18px}.dash-grid{grid-template-columns:1.25fr .75fr}.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:19px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.link{color:var(--violet);font-weight:800;text-decoration:none;cursor:pointer;font-size:13px}.conflict{display:flex;gap:13px;align-items:flex-start;padding:14px 17px;background:var(--redbg);border:1px solid #FECACA;color:#991B1B;border-radius:12px;margin-bottom:20px}.conflict strong{display:block;margin-bottom:2px}.event-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F0EDF4;align-items:center}.event-row:last-child{border:0}.event-time{font-weight:800;color:var(--violet);width:86px;font-size:12px}.event-dot{width:9px;height:9px;border-radius:50%;flex:none}.event-title{font-weight:800}.event-detail{font-size:12px;color:var(--muted);margin-top:2px}.tag,.status{font-size:11px;font-weight:800;border-radius:99px;padding:4px 8px;display:inline-block}.medical{background:#FCE7F3;color:#BE185D}.school{background:#E0F2FE;color:#0369A1}.childcare{background:#DCFCE7;color:#15803D}.personal{background:#FEF3C7;color:#B45309}.work{background:#EDE9FE;color:#6D28D9}.overdue{background:var(--redbg);color:var(--red)}.soon{background:var(--amberbg);color:var(--amber)}.upcoming{background:#EFF6FF;color:var(--blue)}.done{background:var(--greenbg);color:var(--green)}.milestone{padding:12px 0;border-bottom:1px solid #F0EDF4}.milestone:last-child{border:0}.milestone-top{display:flex;justify-content:space-between;gap:8px;font-weight:800}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:14px;text-align:left;display:block}.quick b{display:block;font-size:13px}.quick span{font-size:12px;color:var(--muted);font-weight:600}.stat-grid{grid-template-columns:repeat(3,1fr);margin-bottom:20px}.stat{padding:18px}.stat .num{font:800 25px Poppins,sans-serif;margin-top:7px}.stat .label{color:var(--muted);font-weight:700;font-size:12px}.children-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.child-card{position:relative;padding:20px}.child-avatar{width:46px;height:46px;background:var(--lav2);color:var(--violet);font:800 19px Poppins,sans-serif;border-radius:14px;display:grid;place-items:center;margin-bottom:11px}.child-name{font:800 18px Poppins,sans-serif}.child-meta{color:var(--muted);margin:2px 0 13px}.info-line{font-size:12px;margin:7px 0;color:#554c61}.info-line b{color:#2F263C}.actions{display:flex;gap:7px;margin-top:15px}.empty{padding:35px;text-align:center;color:var(--muted)}.week{overflow-x:auto}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:900px}.daycol{min-height:425px;border-right:1px solid var(--line);background:#fff}.daycol:last-child{border:0}.dayhead{padding:12px;background:#FAF9FC;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;text-align:center}.dayhead.today{background:var(--lav2);color:var(--violet)}.cal-event{padding:8px;margin:8px;border-radius:7px;font-size:11px;font-weight:800;line-height:1.35;border-left:3px solid}.cal-event small{display:block;font-weight:600;opacity:.8}.cal-event.conflicted{background:var(--redbg)!important;color:#991B1B!important;border-color:var(--red)!important}.type-medical{background:#FCE7F3;color:#9D174D;border-color:#EC4899}.type-school{background:#E0F2FE;color:#075985;border-color:#0EA5E9}.type-childcare{background:#DCFCE7;color:#166534;border-color:#22C55E}.type-personal{background:#FEF3C7;color:#92400E;border-color:#F59E0B}.type-work{background:#EDE9FE;color:#5B21B6;border-color:#8B5CF6}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-weight:800;font-size:12px;color:#4F4659}input,select,textarea{width:100%;border:1px solid #DCD6E6;border-radius:8px;padding:10px 11px;font:600 14px Nunito,sans-serif;color:var(--ink);background:white;outline:none}input:focus,select:focus,textarea:focus{border-color:#8B5CF6;box-shadow:0 0 0 3px #EDE9FE}textarea{min-height:105px;resize:vertical}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:0 11px 10px}.data-table td{padding:12px 11px;border-top:1px solid #F0EDF4;vertical-align:middle}.data-table td strong{display:block}.muted{color:var(--muted);font-size:12px}.group-title{display:flex;align-items:center;gap:9px;margin:25px 0 10px;font:800 17px Poppins,sans-serif}.group-title:first-child{margin-top:0}.mini-avatar{width:28px;height:28px;border-radius:9px;background:var(--lav2);color:var(--violet);display:grid;place-items:center;font-size:12px}.draft-card{padding:20px;margin-bottom:15px}.draft-body{white-space:pre-line;line-height:1.65;background:#FAF9FC;border-radius:9px;padding:14px;margin:13px 0;color:#41394C}.match{padding:15px 0;border-bottom:1px solid #F0EDF4}.match:last-child{border:0}.match-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.score{margin:9px 0 11px;height:7px;border-radius:5px;background:#ECE8F2;overflow:hidden}.score i{display:block;height:100%;background:linear-gradient(90deg,#8B5CF6,#6D28D9);border-radius:5px}.finance-grid{grid-template-columns:1fr 1.2fr}.money{font:800 23px Poppins,sans-serif}.income{color:var(--green)}.expense{color:var(--red)}.net{color:var(--violet)}.break-row{display:flex;align-items:center;gap:10px;margin:12px 0}.break-label{width:90px;font-weight:800;font-size:12px}.bar{height:8px;flex:1;background:#EEEAF4;border-radius:9px;overflow:hidden}.bar i{height:100%;display:block;background:#8B5CF6;border-radius:9px}.amount{width:76px;text-align:right;font-weight:800;font-size:12px}.footer{text-align:center;color:#8B8495;font-size:12px;margin-top:38px}.modal-back{position:fixed;inset:0;background:#21153675;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:white;border-radius:16px;width:min(630px,100%);max-height:92vh;overflow:auto;box-shadow:0 18px 60px #1f103a44}.modal-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.x{border:0;background:transparent;font-size:23px;color:#756c81;cursor:pointer}.notice{padding:10px 12px;background:var(--amberbg);color:#92400E;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:14px}.hidden{display:none!important}@media(max-width:780px){.topbar{padding:0 15px;overflow-x:auto}.brand{margin-right:18px}.nav a{padding:8px 9px;font-size:12px}.user{display:none}.page{padding:22px 15px 55px}.dash-grid,.finance-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.data-table{min-width:650px}}
</style>
</head>
<body><div class="app"><header class="topbar"><div class="brand">Keiru<span>.ai</span></div><nav class="nav" id="nav"><a href="#/dashboard">Dashboard</a><a href="#/children">Children</a><a href="#/calendar">Calendar</a><a href="#/milestones">Milestones</a><a href="#/drafts">AI Drafts</a><a href="#/assistance">Assistance</a><a href="#/finances">Finances</a></nav><div class="user"><div class="avatar">D</div> Dante</div></header><main class="page" id="app"></main></div><div id="modalRoot"></div>
<script>
const KEY='keiru_state';
const iso=d=>{let x=new Date(d);x.setHours(0,0,0,0);return x.toISOString().slice(0,10)};
const today=()=>iso(new Date()); const addDays=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function seed(){return {parent:{name:'Dante'},children:[{id:'maya',name:'Maya Rivera',dob:'2017-04-14',school:'Oakwood Elementary',grade:'3rd Grade',doctor:'Dr. Priya Shah · Lakeside Pediatrics',notes:'Loves drawing and needs a quiet transition after school.'},{id:'leo',name:'Leo Rivera',dob:'2020-09-02',school:'Little Sprouts Preschool',grade:'Pre-K',doctor:'Dr. Daniel Kim · Lakeside Pediatrics',notes:'Allergic to peanuts. Favorite comfort toy is his blue fox.'}],events:[{id:'e1',title:'Maya — pediatric checkup',date:addDays(0),start:'15:30',end:'16:30',type:'medical',child:'maya',location:'Lakeside Pediatrics'},{id:'e2',title:'Client project call',date:addDays(0),start:'16:00',end:'17:00',type:'work',child:'',location:'Video call'},{id:'e3',title:'Leo preschool pickup',date:addDays(1),start:'15:15',end:'15:45',type:'childcare',child:'leo',location:'Little Sprouts'},{id:'e4',title:'Maya reading conference',date:addDays(3),start:'08:15',end:'09:00',type:'school',child:'maya',location:'Oakwood Elementary'},{id:'e5',title:'Grocery delivery window',date:addDays(5),start:'10:00',end:'11:00',type:'personal',child:'',location:'Home'}],milestones:[{id:'m1',child:'maya',title:'Return library books',due:addDays(4),completed:''},{id:'m2',child:'maya',title:'Submit field trip permission slip',due:addDays(10),completed:''},{id:'m3',child:'leo',title:'Schedule dental cleaning',due:addDays(-2),completed:''},{id:'m4',child:'leo',title:'Bring family photo for class board',due:addDays(2),completed:''}],drafts:[{id:'d1',type:'school_email',child:'maya',prompt:'Ask Ms. Turner for a brief update on Maya’s reading progress.',body:'Subject: Checking in on Maya’s reading progress\n\nDear Ms. Turner,\n\nI hope you’re doing well. I wanted to check in on Maya’s reading progress and see if there is anything we can reinforce at home. She has been excited to tell me about the books she is reading, and I would value any suggestions you have.\n\nThank you for your support and for all you do for Maya.\n\nWarmly,\nDante Rivera',created:today()}],finances:[{id:'f1',date:today(),type:'income',category:'Client work',amount:3200,note:'Monthly retainer — Northstar Studio'},{id:'f2',date:addDays(-3),type:'expense',category:'Childcare',amount:780,note:'Little Sprouts tuition'},{id:'f3',date:addDays(-5),type:'expense',category:'Groceries',amount:164.28,note:'Weekly groceries'},{id:'f4',date:addDays(-8),type:'expense',category:'Medical',amount:35,note:'Maya co-pay'},{id:'f5',date:addDays(-12),type:'expense',category:'Housing',amount:1450,note:'Rent'}],assistance:[{id:'a1',name:'Child Care Subsidy Program',type:'Childcare',description:'Help covering eligible child care costs while you work.',score:92,applied:false,dismissed:false},{id:'a2',name:'SNAP Nutrition Support',type:'Food',description:'Monthly grocery support for qualifying households.',score:78,applied:false,dismissed:false},{id:'a3',name:'Children’s Health Coverage',type:'Healthcare',description:'Low-cost health coverage and preventive care for children.',score:84,applied:false,dismissed:false},{id:'a4',name:'School Supply Family Fund',type:'Education',description:'Grants for classroom supplies, activities, and school essentials.',score:67,applied:false,dismissed:false}]}}
let state=JSON.parse(localStorage.getItem(KEY)||'null')||seed(); function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function child(id){return state.children.find(x=>x.id===id)} function name(id){return child(id)?.name||'Family'} function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})} function age(d){let a=new Date().getFullYear()-new Date(d).getFullYear();if(new Date()<new Date(new Date(d).setFullYear(new Date().getFullYear())))a--;return a}
function conflicts(events=state.events){let ids=new Set();events.forEach((a,i)=>events.forEach((b,j)=>{if(i<j&&a.date===b.date&&a.start<b.end&&b.start<a.end){ids.add(a.id);ids.add(b.id)}}));return ids} function time(t){let [h,m]=t.split(':');let d=new Date();d.setHours(h,m);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} function typeTag(x){return `<span class="tag ${x}">${x}</span>`}
function layout(title,sub,action,content){return `<div class="page-head"><div><div class="eyebrow">Keiru.ai · your family command center</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${action||''}</div>${content}<div class="footer">Demo build — data stays in your browser.</div>`}
function dashboard(){let cs=conflicts(), ev=[...state.events].sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)), upcoming=state.milestones.filter(m=>!m.completed&&m.due<=addDays(30)).sort((a,b)=>a.due.localeCompare(b.due));let todayEv=ev.filter(e=>e.date===today()), week=ev.filter(e=>e.date>=today()&&e.date<=addDays(7)); return layout('Good morning, Dante','Here’s the family plan at a glance.',`<button class="btn primary" onclick="openEvent()">＋ Add event</button>`,`${cs.size?`<div class="conflict"><div style="font-size:21px">⚠</div><div><strong>Schedule conflict needs your attention</strong>${cs.size} events overlap in your calendar today. <a class="link" href="#/calendar">Review the conflict →</a></div></div>`:''}<div class="grid stat-grid"><div class="card stat"><div class="label">TODAY’S EVENTS</div><div class="num">${todayEv.length}</div></div><div class="card stat"><div class="label">OPEN MILESTONES</div><div class="num">${state.milestones.filter(m=>!m.completed).length}</div></div><div class="card stat"><div class="label">UPCOMING THIS WEEK</div><div class="num">${week.length}</div></div></div><div class="grid dash-grid"><div class="grid"><section class="card"><div class="card-head"><h2>Today’s schedule</h2><a class="link" href="#/calendar">Calendar →</a></div>${todayEv.length?todayEv.map(e=>eventRow(e,cs)).join(''):'<div class="empty">A little breathing room today.</div>'}</section><section class="card"><div class="card-head"><h2>This week</h2></div>${week.map(e=>eventRow(e,cs)).join('')||'<div class="empty">Nothing scheduled yet.</div>'}</section></div><div class="grid"><section class="card"><div class="card-head"><h2>Upcoming milestones</h2><a class="link" href="#/milestones">View all →</a></div>${upcoming.slice(0,4).map(m=>`<div class="milestone"><div class="milestone-top"><span>${esc(m.title)}</span>${due(m)}</div><div class="event-detail">${name(m.child)} · ${fmt(m.due)}</div></div>`).join('')||'<div class="empty">All caught up!</div>'}</section><section class="card"><div class="card-head"><h2>Quick add</h2></div><div class="quick"><button class="btn secondary" onclick="openEvent()"><b>＋ Event</b><span>Add to calendar</span></button><button class="btn secondary" onclick="openMilestone()"><b>✓ Milestone</b><span>Track a task</span></button><button class="btn secondary" onclick="location.hash='#/drafts'"><b>✦ AI Draft</b><span>Write to school</span></button><button class="btn secondary" onclick="location.hash='#/finances'"><b>＋ Expense</b><span>Log spending</span></button></div></section></div></div>`)}
function eventRow(e,cs){return `<div class="event-row"><div class="event-time">${time(e.start)}</div><div class="event-dot" style="background:${cs.has(e.id)?'#DC2626':'#8B5CF6'}"></div><div style="flex:1"><div class="event-title">${esc(e.title)} ${cs.has(e.id)?'<span class="tag overdue">Conflict</span>':''}</div><div class="event-detail">${e.location?esc(e.location)+' · ':''}${e.child?name(e.child):'Dante'} · ends ${time(e.end)}</div></div></div>`}
function childrenView(){return layout('Children','Keep every important detail in one calm place.',`<button class="btn primary" onclick="openChild()">＋ Add child</button>`,`<div class="grid children-grid">${state.children.map(c=>`<section class="card child-card"><div class="child-avatar">${esc(c.name[0])}</div><div class="child-name">${esc(c.name)}</div><div class="child-meta">Age ${age(c.dob)} · ${esc(c.grade)}</div><div class="info-line"><b>School:</b> ${esc(c.school)}</div><div class="info-line"><b>Doctor:</b> ${esc(c.doctor)}</div><div class="info-line"><b>Notes:</b> ${esc(c.notes)}</div><div class="actions"><button class="btn small secondary" onclick="openChild('${c.id}')">Edit details</button><button class="btn small danger" onclick="deleteChild('${c.id}')">Delete</button></div></section>`).join('')}</div>`)}
function calendarView(){let start=new Date();start.setHours(0,0,0,0);let dow=start.getDay();start.setDate(start.getDate()-(dow===0?6:dow-1));let cs=conflicts();let cols=Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);let key=iso(d), events=state.events.filter(e=>e.date===key).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="daycol"><div class="dayhead ${key===today()?'today':''}">${d.toLocaleDateString(undefined,{weekday:'short'})}<br><span style="font-size:16px">${d.getDate()}</span></div>${events.map(e=>`<div class="cal-event type-${e.type} ${cs.has(e.id)?'conflicted':''}" title="${esc(e.location)}"><span>${esc(e.title)}</span><small>${time(e.start)}–${time(e.end)} ${cs.has(e.id)?' · CONFLICT':''}</small></div>`).join('')}</div>`}).join('');return layout('Calendar','Your next seven days, organized around what matters.',`<button class="btn primary" onclick="openEvent()">＋ Add event</button>`,`${cs.size?`<div class="conflict"><div>⚠</div><div><strong>Overlapping events detected</strong>Conflicted events are highlighted in red. Edit an event to resolve the overlap.</div></div>`:''}<section class="card week"><div class="card-head"><h2>This week</h2><span class="muted">${fmt(iso(start))} – ${fmt(iso(new Date(start.getTime()+6*86400000)))}</span></div><div class="weekgrid">${cols}</div></section><section class="card" style="margin-top:18px"><div class="card-head"><h2>All scheduled events</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date & time</th><th>Event</th><th>Type</th><th>Child</th><th></th></tr></thead><tbody>${state.events.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)).map(e=>`<tr><td><strong>${fmt(e.date)}</strong><span class="muted">${time(e.start)} – ${time(e.end)}</span></td><td><strong>${esc(e.title)}</strong><span class="muted">${esc(e.location)}</span></td><td>${typeTag(e.type)} ${cs.has(e.id)?'<span class="tag overdue">conflict</span>':''}</td><td>${e.child?name(e.child):'—'}</td><td><button class="btn small secondary" onclick="openEvent('${e.id}')">Edit</button> <button class="btn small danger" onclick="deleteEvent('${e.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></section>`)}
function due(m){let n=Math.ceil((new Date(m.due+'T12:00')-new Date(today()+'T12:00'))/86400000);return n<0?'<span class="status overdue">Overdue</span>':n<=7?'<span class="status soon">Due soon</span>':'<span class="status upcoming">Upcoming</span>'}
function milestonesView(){return layout('Milestones','Small deadlines, visible before they become stressful.',`<button class="btn primary" onclick="openMilestone()">＋ Add milestone</button>`,state.children.map(c=>{let ms=state.milestones.filter(m=>m.child===c.id);return `<section class="card"><div class="group-title"><span class="mini-avatar">${esc(c.name[0])}</span>${esc(c.name)} <span class="muted">${ms.filter(m=>!m.completed).length} open</span></div>${ms.length?ms.map(m=>`<div class="event-row"><div style="flex:1"><div class="event-title ${m.completed?'muted':''}">${m.completed?'✓ ':''}${esc(m.title)}</div><div class="event-detail">Due ${fmt(m.due)}${m.completed?' · Completed '+fmt(m.completed):''}</div></div>${m.completed?'<span class="status done">Complete</span>':due(m)}<div class="actions" style="margin:0">${!m.completed?`<button class="btn small secondary" onclick="completeMilestone('${m.id}')">Complete</button>`:''}<button class="btn small danger" onclick="deleteMilestone('${m.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No milestones for this child yet.</div>'}</section>`}).join(''))}
function draftsView(){return layout('AI Drafts','Clear, thoughtful school communication—without starting from a blank page.',null,`<div class="grid dash-grid"><section class="card"><div class="card-head"><h2>Create a school draft</h2><span class="tag work">AI-assisted</span></div><form onsubmit="generateDraft(event)"><div class="form-grid"><div class="field"><label>Draft type</label><select name="type"><option value="school_email">School email</option><option value="accommodation_request">Accommodation request</option><option value="permission_form">Permission form note</option></select></div><div class="field"><label>Child</label><select name="child">${childOptions()}</select></div><div class="field full"><label>What would you like to communicate?</label><textarea name="prompt" required placeholder="For example: Maya will be absent Friday for an appointment. Ask about makeup work."></textarea></div></div><button class="btn primary" style="margin-top:14px" type="submit">✦ Generate draft</button></form></section><aside class="card"><h2 style="margin-bottom:10px">A steadier way to write</h2><p class="sub" style="line-height:1.6">Keiru uses your child’s school and grade details to create warm, specific communication you can make your own.</p><div class="notice" style="margin-top:17px">Every draft is saved privately in this browser.</div></aside></div><section style="margin-top:22px"><div class="card-head"><h2>Saved drafts</h2><span class="muted">${state.drafts.length} saved</span></div>${state.drafts.sort((a,b)=>b.created.localeCompare(a.created)).map(d=>`<article class="card draft-card"><div class="card-head"><div><h3>${d.type.replaceAll('_',' ')}</h3><div class="muted">For ${name(d.child)} · ${fmt(d.created)}</div></div><div class="actions" style="margin:0"><button class="btn small secondary" onclick="copyDraft('${d.id}')">Copy</button><button class="btn small danger" onclick="deleteDraft('${d.id}')">Delete</button></div></div><div class="draft-body">${esc(d.body)}</div></article>`).join('')||'<div class="card empty">Your generated drafts will appear here.</div>'}</section>`)}
function assistanceView(){let a=state.assistance.filter(x=>!x.dismissed);return layout('Assistance','Programs matched to your family’s current financial picture.',`<button class="btn primary" onclick="runMatcher()">✦ Run matcher</button>`, `<div class="grid dash-grid"><section class="card"><div class="card-head"><h2>Your matches</h2><span class="muted">${a.length} active matches</span></div>${a.map(p=>`<div class="match"><div class="match-top"><div><h3>${esc(p.name)} ${p.applied?'<span class="status done">Applied</span>':''}</h3><p class="event-detail">${esc(p.description)}</p></div>${typeTag(p.type==='Healthcare'?'medical':p.type==='Food'?'personal':p.type==='Education'?'school':'childcare')}</div><div class="score"><i style="width:${p.score}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="muted"><b style="color:var(--violet)">${p.score}%</b> eligibility match</span><div class="actions" style="margin:0">${!p.applied?`<button class="btn small secondary" onclick="applyProgram('${p.id}')">Mark applied</button>`:''}<button class="btn small plain" onclick="dismissProgram('${p.id}')">Dismiss</button></div></div></div>`).join('')||'<div class="empty">No active matches. Run the matcher to refresh.</div>'}</section><aside class="card"><h2>How matching works</h2><p class="sub" style="line-height:1.65">Keiru considers your logged income, household expenses, and your children’s ages to prioritize relevant support programs.</p><div class="notice" style="margin-top:18px">Matches are guidance, not an eligibility determination. Check each program’s official requirements before applying.</div><a class="link" href="#/finances">Review finance details →</a></aside></div>`)}
function financesView(){let inc=state.finances.filter(f=>f.type==='income').reduce((s,f)=>s+Number(f.amount),0), exp=state.finances.filter(f=>f.type==='expense').reduce((s,f)=>s+Number(f.amount),0), cats={};state.finances.filter(f=>f.type==='expense').forEach(f=>cats[f.category]=(cats[f.category]||0)+Number(f.amount));return layout('Finances','A simple view of what’s coming in and going out.',`<button class="btn primary" onclick="openFinance()">＋ Add entry</button>`,`<div class="grid stat-grid"><div class="card stat"><div class="label">TOTAL INCOME</div><div class="num income">${money(inc)}</div></div><div class="card stat"><div class="label">TOTAL EXPENSES</div><div class="num expense">${money(exp)}</div></div><div class="card stat"><div class="label">NET BALANCE</div><div class="num net">${money(inc-exp)}</div></div></div><div class="grid finance-grid"><section class="card"><div class="card-head"><h2>Expense breakdown</h2></div>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="break-row"><div class="break-label">${esc(c)}</div><div class="bar"><i style="width:${Math.round(v/exp*100)}%"></i></div><div class="amount">${money(v)}</div></div>`).join('')||'<div class="empty">No expenses logged.</div>'}</section><section class="card"><div class="card-head"><h2>Recent entries</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Entry</th><th>Amount</th><th></th></tr></thead><tbody>${state.finances.sort((a,b)=>b.date.localeCompare(a.date)).map(f=>`<tr><td>${fmt(f.date)}</td><td><strong>${esc(f.category)}</strong><span class="muted">${esc(f.note||'')}</span></td><td class="${f.type==='income'?'income':'expense'}"><strong>${f.type==='income'?'+':'−'}${money(f.amount)}</strong></td><td><button class="btn small secondary" onclick="openFinance('${f.id}')">Edit</button><button class="btn small danger" onclick="deleteFinance('${f.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></section></div>`)} function money(n){return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(n)}
function childOptions(selected=''){return `<option value="">No child selected</option>`+state.children.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function render(){let r=location.hash.split('/')[1]||'dashboard';let map={dashboard,children:childrenView,calendar:calendarView,milestones:milestonesView,drafts:draftsView,assistance:assistanceView,finances:financesView};document.getElementById('app').innerHTML=(map[r]||dashboard)();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+r))} window.addEventListener('hashchange',render);if(!location.hash)location.hash='#/dashboard';render();
function modal(title,body,foot=''){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="x" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openChild(id){let c=state.children.find(x=>x.id===id)||{name:'',dob:'',school:'',grade:'',doctor:'',notes:''};modal(id?'Edit child':'Add a child',`<form id="childForm"><div class="form-grid"><div class="field"><label>Name</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Date of birth</label><input type="date" name="dob" required value="${c.dob}"></div><div class="field"><label>School</label><input name="school" value="${esc(c.school)}"></div><div class="field"><label>Grade</label><input name="grade" value="${esc(c.grade)}"></div><div class="field full"><label>Doctor / pediatrician</label><input name="doctor" value="${esc(c.doctor)}"></div><div class="field full"><label>Helpful notes</label><textarea name="notes">${esc(c.notes)}</textarea></div></div></form>`,`<button class="btn plain" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveChild('${id||''}')">Save child</button>`)}
function saveChild(id){let f=document.getElementById('childForm');if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f));if(id)Object.assign(state.children.find(c=>c.id===id),x);else state.children.push({...x,id:uid()});save();closeModal();render()}function deleteChild(id){if(confirm('Delete this child and their related records?')){state.children=state.children.filter(c=>c.id!==id);state.events.forEach(e=>{if(e.child===id)e.child=''});state.milestones=state.milestones.filter(m=>m.child!==id);save();render()}}
function openEvent(id){let e=state.events.find(x=>x.id===id)||{title:'',date:today(),start:'09:00',end:'10:00',type:'school',child:'',location:''};modal(id?'Edit event':'Add an event',`<form id="eventForm"><div class="form-grid"><div class="field full"><label>Event title</label><input name="title" required value="${esc(e.title)}"></div><div class="field"><label>Date</label><input type="date" name="date" required value="${e.date}"></div><div class="field"><label>Type</label><select name="type">${['medical','school','childcare','personal','work'].map(x=>`<option ${e.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Start time</label><input type="time" name="start" required value="${e.start}"></div><div class="field"><label>End time</label><input type="time" name="end" required value="${e.end}"></div><div class="field"><label>Child</label><select name="child">${childOptions(e.child)}</select></div><div class="field"><label>Location</label><input name="location" value="${esc(e.location)}"></div></div></form>`,`<button class="btn plain" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEvent('${id||''}')">Save event</button>`)}function saveEvent(id){let f=document.getElementById('eventForm');if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f));if(x.end<=x.start){alert('End time must be after start time.');return}let test=id?state.events.map(e=>e.id===id?{...x,id}:e):[...state.events,{...x,id:'new'}];let has=conflicts(test).has(id||'new');if(has&&!confirm('This event overlaps another event. Save it as a conflict?'))return;if(id)Object.assign(state.events.find(e=>e.id===id),x);else state.events.push({...x,id:uid()});save();closeModal();render()}function deleteEvent(id){if(confirm('Delete this event?')){state.events=state.events.filter(e=>e.id!==id);save();render()}}
function openMilestone(){modal('Add milestone',`<form id="mileForm"><div class="form-grid"><div class="field full"><label>Milestone or task</label><input name="title" required></div><div class="field"><label>Child</label><select name="child" required>${state.children.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Due date</label><input type="date" name="due" required value="${addDays(7)}"></div></div></form>`,`<button class="btn plain" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMilestone()">Save milestone</button>`)}function saveMilestone(){let f=document.getElementById('mileForm');if(!f.reportValidity())return;state.milestones.push({...Object.fromEntries(new FormData(f)),id:uid(),completed:''});save();closeModal();render()}function completeMilestone(id){state.milestones.find(m=>m.id===id).completed=today();save();render()}function deleteMilestone(id){if(confirm('Delete this milestone?')){state.milestones=state.milestones.filter(m=>m.id!==id);save();render()}}
function generateDraft(ev){ev.preventDefault();let x=Object.fromEntries(new FormData(ev.target)),c=child(x.child), kind=x.type==='accommodation_request'?'Subject: Request for support for '+c.name+'\n\nDear [Teacher/School Team],\n\nI’m writing to share a request for support for '+c.name+', who is in '+c.grade+' at '+c.school+'. '+x.prompt+'\n\nAs '+c.name+'’s parent, I want to partner with you in a way that helps them feel confident and successful at school. I would be grateful for the opportunity to discuss practical accommodations or next steps that may be helpful. Please let me know a time that works for a brief conversation.\n\nThank you for your care and partnership.\n\nWarmly,\nDante Rivera':x.type==='permission_form'?'Subject: Permission and family note for '+c.name+'\n\nDear [Teacher/School Team],\n\nI am writing regarding '+c.name+' in '+c.grade+' at '+c.school+'. '+x.prompt+'\n\nPlease consider this note my confirmation and let me know if you need any additional information, signatures, or forms from me. I appreciate your help making sure '+c.name+' can participate safely and fully.\n\nThank you,\nDante Rivera':'Subject: A note about '+c.name+'\n\nDear [Teacher’s Name],\n\nI hope you’re doing well. I’m reaching out as '+c.name+'’s parent. '+x.prompt+'\n\nI appreciate all you do to support '+c.name+' in '+c.grade+'. Please let me know if there is anything helpful I can do from home, or if a quick conversation would be useful.\n\nThank you for your time and partnership.\n\nWarmly,\nDante Rivera';state.drafts.unshift({id:uid(),...x,body:kind,created:today()});save();render()}function copyDraft(id){let t=state.drafts.find(d=>d.id===id).body;navigator.clipboard?.writeText(t).catch(()=>{});alert('Draft copied to your clipboard.')}function deleteDraft(id){if(confirm('Delete this draft?')){state.drafts=state.drafts.filter(d=>d.id!==id);save();render()}}
function runMatcher(){let income=state.finances.filter(f=>f.type==='income').reduce((s,f)=>s+Number(f.amount),0);state.assistance.forEach((p,i)=>{p.dismissed=false;p.score=Math.min(97,Math.max(45,Math.round(92-i*9-(income>5000?13:income>3500?6:0)+Math.random()*5)))});save();render()}function applyProgram(id){state.assistance.find(p=>p.id===id).applied=true;save();render()}function dismissProgram(id){state.assistance.find(p=>p.id===id).dismissed=true;save();render()}
function openFinance(id){let f=state.finances.find(x=>x.id===id)||{date:today(),type:'expense',category:'Groceries',amount:'',note:''};modal(id?'Edit finance entry':'Add finance entry',`<form id="financeForm"><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" required value="${f.date}"></div><div class="field"><label>Entry type</label><select name="type"><option value="income" ${f.type==='income'?'selected':''}>Income</option><option value="expense" ${f.type==='expense'?'selected':''}>Expense</option></select></div><div class="field"><label>Category</label><input name="category" required value="${esc(f.category)}" list="categories"><datalist id="categories"><option>Client work</option><option>Childcare</option><option>Groceries</option><option>Medical</option><option>Housing</option><option>Transport</option><option>Education</option></datalist></div><div class="field"><label>Amount</label><input type="number" min="0.01" step="0.01" name="amount" required value="${f.amount}"></div><div class="field full"><label>Note</label><input name="note" value="${esc(f.note)}"></div></div></form>`,`<button class="btn plain" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveFinance('${id||''}')">Save entry</button>`)}function saveFinance(id){let f=document.getElementById('financeForm');if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f));x.amount=Number(x.amount);if(id)Object.assign(state.finances.find(q=>q.id===id),x);else state.finances.push({...x,id:uid()});save();closeModal();render()}function deleteFinance(id){if(confirm('Delete this finance entry?')){state.finances=state.finances.filter(f=>f.id!==id);save();render()}}
</script></body></html>
